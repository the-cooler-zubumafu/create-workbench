name: Integration tests

on:
  push:
  pull_request:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Game tests
    runs-on: ubuntu-latest
    # Generous: the first run downloads/generates the NeoForm artifacts.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run game tests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametests.log

      - name: Upload game test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametests-log
          path: gametests.log
          if-no-files-found: ignore
